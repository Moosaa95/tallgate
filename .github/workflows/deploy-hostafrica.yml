name: HostAfrica Production Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://tallgateltd.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Package production deployment
        run: |
          mkdir -p deployment
          cp -a .next public package.json package-lock.json server.js next.config.mjs deployment/
          cd deployment
          zip -qr ../tallgate-hostafrica.zip .

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: tallgate-hostafrica
          path: tallgate-hostafrica.zip
          if-no-files-found: error
          retention-days: 3
